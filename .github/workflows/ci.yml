name: CI

on:
  push:
  pull_request:

jobs:
  smoke-posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run focused smoke acceptance
        run: bash tests/smoke.sh

  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg
        shell: powershell
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
      - name: Run Windows extraction smoke acceptance
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\smoke-windows.ps1
      - name: Probe B desktop UI and native bridge
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\ui-windows-probe.ps1
